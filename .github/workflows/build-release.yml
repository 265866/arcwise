name: Release build

# Builds the installer, zip and checksums that a release attaches. The release workflow calls it.
# It also runs on PRs that change what goes into the build, and by hand from the Actions tab.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit or tag to build
        type: string
        required: true
    outputs:
      version:
        description: The version that was built, such as 0.2.0
        value: ${{ jobs.build.outputs.version }}
      artifact:
        description: The name of the uploaded artifact
        value: ${{ jobs.build.outputs.artifact }}
  workflow_dispatch:
  pull_request:
    paths:
      - .cargo/**
      - .github/workflows/build-release.yml
      - Cargo.lock
      - Cargo.toml
      - about.hbs
      - about.toml
      - crates/*/Cargo.toml
      - crates/arcwise/build.rs
      - installer/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Installer
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - run: cargo build --release --locked -p arcwise

      - name: Check the exe runs without the Visual C++ runtime
        run: |
          $exe = [IO.File]::ReadAllBytes('target\release\arcwise.exe')
          if ([Text.Encoding]::ASCII.GetString($exe).Contains('VCRUNTIME140')) {
            throw 'arcwise.exe imports VCRUNTIME140.dll, so +crt-static from .cargo/config.toml was not applied.'
          }

      - run: cargo about generate --locked about.hbs -o target\release\THIRD-PARTY-LICENSES.html

      - name: Read the version
        id: version
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'arcwise').version
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact=arcwise-$version" >> $env:GITHUB_OUTPUT

      # The runner has Inno Setup through Chocolatey, which puts ISCC on the path.
      - name: Build the installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          iscc /Qp "/DAppVersion=$env:VERSION" installer\arcwise.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Zip and write checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $staging = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\arcwise-$env:VERSION"
          Copy-Item target\release\arcwise.exe, target\release\THIRD-PARTY-LICENSES.html $staging
          Copy-Item LICENSE (Join-Path $staging 'LICENSE.txt')
          Compress-Archive -Path "$staging\*" -DestinationPath "dist\arcwise-$env:VERSION-x64.zip"
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: dist/*
          if-no-files-found: error
