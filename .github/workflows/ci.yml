name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # The video tests decode a clip through Media Foundation, which Windows Server leaves out
      # unless the feature is installed.
      - name: Install Media Foundation
        shell: pwsh
        run: |
          $feature = Get-WindowsFeature Server-Media-Foundation
          if (-not $feature.Installed) { Install-WindowsFeature Server-Media-Foundation | Format-List }

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: cargo test --doc --all-features
