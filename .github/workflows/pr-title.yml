name: PR title

# Squash merges use the PR title as the commit on main, and release-plz reads those commits to
# pick the next version and write the changelog.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  check:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: [^ ].*$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::The PR title is not a conventional commit title, such as 'feat(board): show counts' or 'fix(video)!: drop AV1 fallback'."
            exit 1
          fi
