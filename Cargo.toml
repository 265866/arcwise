[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/265866/arcwise"
publish = false

[workspace.dependencies]
anyhow = "1"
arcwise-core = { path = "crates/arcwise-core" }
# A commit on Zed's main branch; the crates.io release of gpui is a year behind it.
gpui = { git = "https://github.com/zed-industries/zed", rev = "52b2927a1bac46be5d50ad341ac00b665e13764b" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "52b2927a1bac46be5d50ad341ac00b665e13764b" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

# The forks Zed's own workspace patches in; gpui is only tested against them.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }

[profile.release]
lto = "thin"
codegen-units = 1
