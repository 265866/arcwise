[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/265866/arcwise"
publish = false

[workspace.dependencies]
anyhow = "1"
arcwise-core = { path = "crates/arcwise-core" }
arcwise-video = { path = "crates/arcwise-video" }
# A commit on Zed's main branch; the crates.io release of gpui is a year behind it.
gpui = { git = "https://github.com/zed-industries/zed", rev = "e39fb7c2e0560d013df0e77bce1922bf5cce1ad9" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "e39fb7c2e0560d013df0e77bce1922bf5cce1ad9" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

# The forks Zed's own workspace patches in; gpui is only tested against them.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }

[profile.release]
lto = "thin"
codegen-units = 1

# Release code with line tables, for sampling profilers: `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
