# cargo-about writes THIRD-PARTY-LICENSES.html for release builds from about.hbs. Keep this list in
# step with [licenses] in deny.toml.
accepted = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The crates below have license text cargo-about cannot recognize on its own, so they would get
# the canonical text without their copyright lines. Each checksum pins the file it was read from.

# libwebp-sys compiles Google's libwebp into the exe, under libwebp's own BSD license.
[libwebp-sys.clarify]
license = "MIT AND BSD-3-Clause"
[[libwebp-sys.clarify.files]]
path = "vendor/COPYING"
license = "BSD-3-Clause"
checksum = "5aec868f669e384a22372a4e8a1a6cd7d44c64cd451f960ca69cc170d1e13acf"

