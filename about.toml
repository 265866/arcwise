# cargo-about writes THIRD-PARTY-LICENSES.html for release builds from about.hbs. Keep this list in
# step with [licenses] in deny.toml.
accepted = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
