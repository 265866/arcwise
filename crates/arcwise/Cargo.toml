[package]
name = "arcwise"
description = "A desktop lineup browser for Valorant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
arcwise-core.workspace = true
arcwise-video.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
libwebp-sys = "0.14"
resvg = { version = "0.48", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
semver = "1"
# Pinned: still 0.x, and each release refreshes the Sigstore trust root built into the app.
sigstore-verify = { version = "=0.15.0", default-features = false, features = ["aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
