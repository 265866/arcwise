[package]
name = "arcwise"
description = "A desktop lineup browser for Valorant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
arcwise-core.workspace = true
arcwise-video.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
libwebp-sys = "0.14"
resvg = { version = "0.46", default-features = false }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
