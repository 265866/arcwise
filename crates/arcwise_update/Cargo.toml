[package]
name = "arcwise_update"
description = "Finds, downloads and checks Arcwise's updates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned: still 0.x, and each release refreshes the Sigstore trust root built into the app.
sigstore-verify = { version = "=0.16.0", default-features = false, features = ["aws-lc-rs"] }
ureq = { version = "3", default-features = false, features = [
    "rustls-no-provider",
    "platform-verifier",
] }

[lints]
workspace = true
