# release-plz keeps a release PR open that bumps the version and updates CHANGELOG.md from the
# conventional commits on main. Merging that PR tags the release; .github/workflows/release.yml
# then builds it and publishes the GitHub release with its files.
[workspace]
# Versions come from v* tags, and nothing is published to crates.io.
git_only = true
semver_check = false
# Before 1.0, a feat commit moves 0.1 to 0.2 rather than 0.1.0 to 0.1.1.
features_always_increment_minor = true
release_always = false
pr_labels = ["release"]
# The workspace shares one version and one tag, which only the app package creates.
git_tag_name = "v{{ version }}"
git_tag_enable = false
# The release workflow creates the GitHub release once its files are built.
git_release_enable = false
changelog_update = false

[[package]]
name = "arcwise"
changelog_path = "./CHANGELOG.md"
changelog_update = true
changelog_include = ["arcwise-core", "arcwise-video"]
git_tag_enable = true
